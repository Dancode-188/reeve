[package]
name = "reeve-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Reeve's evaluation engine: heuristics, LLM judge, policy rules, and budgets. Internal; its API may change in any release."
readme = "README.md"

[lints]
workspace = true

[dependencies]
reeve-model = { path = "../reeve-model", version = "1.2.0" }
reeve-storage = { path = "../reeve-storage", version = "1.2.0" }
tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
evalexpr = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
rand = "0.8"

[dev-dependencies]
tempfile = "3"
# `test-util` only, for the paused clock. The dispatch wait is five
# minutes, so a test of what a dropped call costs has to be able to
# reach the end of that wait without spending it.
tokio = { workspace = true, features = ["test-util"] }
