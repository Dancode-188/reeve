name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide the other's result.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # No protoc here on purpose. The bindings are committed (ADR-0044), so
      # this job doubles as the proof that a build needs nothing but Rust.
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release
      - name: Python SDK tests
        working-directory: sdk/python
        run: |
          pip install grpcio opentelemetry-sdk opentelemetry-exporter-otlp-proto-grpc protobuf pytest pytest-asyncio openai-agents claude-agent-sdk
          pytest

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  # The proto bindings are committed so that building needs no protoc. This is
  # the price of that: regenerate them here and fail if the result differs from
  # what is checked in, so an edited proto cannot quietly ship stale bindings.
  proto:
    name: generated proto is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update -y && sudo apt-get install -y protobuf-compiler
      - run: REEVE_REGENERATE_PROTO=1 cargo build -p reeve-intervention -p reeve-sdk
      - name: Fail if the committed bindings are stale
        run: |
          git diff --exit-code -- \
            crates/reeve-intervention/src/generated \
            crates/reeve-sdk/src/generated
