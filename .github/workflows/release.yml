name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl, not gnu: a glibc-linked binary carries the builder's
          # glibc version as a floor, and the runner's is newer than most
          # distributions ship. Static links that problem away.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: reeve-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: reeve-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: reeve-macos-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # No protoc on any runner: the bindings are committed (ADR-0044).
      # musl-tools is the linker for the static Linux target, not a
      # build dependency of the crates.
      - name: Install the musl toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -y && sudo apt-get install -y musl-tools
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p reeve-cockpit
      - name: Rename for the release page
        run: cp target/${{ matrix.target }}/release/reeve ${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish release with binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "Reeve ${{ github.ref_name }}" \
            --notes "See [CHANGELOG.md](https://github.com/Dancode-188/reeve/blob/main/CHANGELOG.md) for details." \
            reeve-linux-x86_64 reeve-macos-arm64 reeve-macos-x86_64 || \
          gh release upload ${{ github.ref_name }} \
            reeve-linux-x86_64 reeve-macos-arm64 reeve-macos-x86_64 --clobber
